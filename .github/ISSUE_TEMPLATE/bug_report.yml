name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a **security** problem, do not post details here: see [SECURITY.md](https://github.com/NassB/dualnet/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you saw, what you expected.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        In dualnet: **Settings → Diagnostics → Copy diagnostics**, then paste here (or run `dualnet doctor`).
        It lists your network interface names and addresses: remove what you do not want to share.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dualnet version
      description: Shown next to the logo in the window, or `dualnet version`.
      placeholder: v0.4.0
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Transparent (administrator)
        - Proxy / interface only
        - Command line (get, proxy…)
        - Not sure
