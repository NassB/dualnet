<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dualnet</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f8; --side: #eceef3; --panel: #ffffff; --panel2: #f7f8fa; --border: #e2e5eb; --text: #161a20;
  --muted: #69727f; --grid: #eceef2; --accent: #2f6fed; --accent-2: #5b8ef5; --ok: #1f9d55; --err: #d64545; --warn: #c27c0e;
  --l0: #2f6fed; --l1: #ef7d22; --l2: #1f9d55; --l3: #9b51e0;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --side: #0b0d11; --panel: #161a21; --panel2: #1b2029; --border: #252b35; --text: #e8ebef;
    --muted: #8b95a5; --grid: #222831; --accent: #5b8ef5; --accent-2: #7aa5ff; --ok: #3cc47c; --err: #f06a6a; --warn: #e3a33a;
    --l0: #5b8ef5; --l1: #f39a4c; --l2: #3cc47c; --l3: #b67cf0;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 228px 1fr; height: 100vh; }

/* ---------- sidebar ---------- */
nav { background: var(--side); border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font-size: 17px; letter-spacing: -.01em; }
.brand small { display: block; color: var(--muted); font-size: 11px; }
.nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px; color: var(--muted);
  cursor: pointer; border: 0; background: none; text-align: left; width: 100%; font-weight: 500; }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
.nav-item.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.nav-item.active svg { color: var(--accent); }
.nav-spacer { flex: 1; }
.conn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }

/* ---------- main ---------- */
main { overflow-y: auto; padding: 26px 30px 40px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.page { display: none; max-width: 1120px; margin: 0 auto; animation: fade .18s ease; }
.page.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; font-weight: 650; }
.lead { color: var(--muted); margin: 0 0 22px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 14px; }
.mt { margin-top: 14px; }

/* hero */
.hero { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; padding: 22px 24px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--panel)), var(--panel) 60%); }
.hero.off { background: var(--panel); }
.power { width: 74px; height: 74px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--accent); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 40%, transparent);
  transition: transform .15s, background .2s, box-shadow .2s; }
.power:hover { transform: scale(1.04); }
.power:active { transform: scale(.97); }
.power svg { width: 32px; height: 32px; }
.power.off { background: var(--panel2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
.power:disabled { opacity: .6; cursor: progress; }
.hero-title { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.hero-sub { color: var(--muted); margin-top: 2px; }
.speed { text-align: right; }
.speed .num { font-size: 40px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.speed .unit { color: var(--muted); font-size: 14px; margin-left: 4px; }
.speed .peak { color: var(--muted); font-size: 12px; margin-top: 6px; }
.sharebar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; display: flex; }
.sharebar span { display: block; height: 100%; transition: width .4s ease; }

/* link cards */
.links { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-top: 14px; }
.link { position: relative; }
.link.down { opacity: .55; }
.link-head { display: flex; align-items: center; gap: 9px; }
.link-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.link-icon svg { width: 18px; height: 18px; }
.link-name { font-weight: 600; }
.link-ip { color: var(--muted); font-size: 12px; }
.link-val { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 14px 0 2px; font-variant-numeric: tabular-nums; }
.link-val small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 3px; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--text); font-weight: 600; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: auto; }
.badge.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.badge.idle { color: var(--muted); background: var(--grid); }
.badge.bad { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.link { padding-bottom: 54px; }
select.role { padding: 4px 6px; font-size: 12px; max-width: 230px; }
.card-actions { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 6px; }

/* chart */
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.chart-box { position: relative; height: 250px; }
canvas { width: 100%; height: 100%; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
  padding: 8px 10px; font-size: 12px; display: none; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.18); font-variant-numeric: tabular-nums; }
.tip b { display: block; margin-bottom: 3px; }
.tip div { display: flex; align-items: center; gap: 6px; }

/* controls */
.btn { border: 1px solid transparent; background: var(--accent); color: #fff; border-radius: 9px; padding: 8px 15px; font-weight: 600; cursor: pointer; transition: filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--border); font-weight: 500; }
.btn.ghost:hover { background: var(--panel2); filter: none; }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.chosen { color: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
input[type=url], select { background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; }
input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; }

.switch { position: relative; width: 42px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: color-mix(in srgb, var(--muted) 35%, var(--panel2)); transition: background .2s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:disabled + span { opacity: .45; cursor: not-allowed; }

.setting { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border); }
.setting:first-of-type { border-top: 0; padding-top: 2px; }
.setting .txt { flex: 1; min-width: 0; }
.setting .title { font-weight: 600; }
.setting .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.setting .sub.warn { color: var(--warn); }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
.howto { color: var(--muted); font-size: 13px; }
.howto ol { padding-left: 18px; margin: 8px 0; } .howto li { margin-bottom: 6px; }

.warn-banner { display: none; align-items: flex-start; gap: 10px; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border));
  color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--panel)); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; font-size: 13px; }
.app-row { display: grid; grid-template-columns: minmax(120px, 1.3fr) 70px 90px 90px minmax(90px, 1fr) minmax(130px, 150px) 92px; gap: 10px;
  align-items: center; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13px; font-variant-numeric: tabular-nums; }
.app-row.head { border-top: 0; color: var(--muted); font-size: 12px; padding-top: 0; }
.app-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-row .r { text-align: right; }
.app-row select { padding: 4px 6px; font-size: 12px; width: 100%; }
.rule-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
.rule-row b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
form.rule-add { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
form.rule-add input { flex: 1 1 200px; min-width: 0; background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; }
@media (max-width: 760px) { .app-row { grid-template-columns: 1fr 70px 90px; } .app-row .hide-sm { display: none; } }
.info-banner { display: none; align-items: center; gap: 10px; border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border));
  color: var(--text); background: color-mix(in srgb, var(--accent) 9%, var(--panel)); border-radius: 12px; padding: 9px 14px; margin-bottom: 14px; font-size: 13px; }
.info-banner svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
.info-banner span { flex: 1; }
.log { margin: 4px 0 0; max-height: 300px; overflow: auto; background: var(--panel2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; font: 12px/1.5 "Cascadia Code", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.onboard { margin-bottom: 14px; }
.chk { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
.chk:first-child { border-top: 0; }
.chk .ico { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.chk.ok .ico { background: var(--ok); } .chk.info .ico { background: var(--muted); }
.chk.warn .ico { background: var(--warn); } .chk.fail .ico { background: var(--err); }
.chk span.txt { flex: 1; min-width: 0; }
#onbList { margin-top: 6px; }
.warn-banner svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }

/* downloads */
form.dl { display: flex; gap: 8px; flex-wrap: wrap; }
form.dl input { flex: 1 1 280px; min-width: 0; }
.jobs { display: grid; gap: 10px; margin-top: 14px; }
.job { border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; background: var(--panel2); }
.job .top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.job .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.job .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 7px; }
.job .actions { display: flex; gap: 6px; align-items: center; flex: none; }
.bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; display: flex; margin-top: 10px; }
.bar span { display: block; height: 100%; }
.state { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.state.running { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
.state.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.state.error { color: var(--err); background: color-mix(in srgb, var(--err) 13%, transparent); }
.state.cancelled { color: var(--muted); background: var(--grid); }
.empty { color: var(--muted); font-size: 13px; padding: 18px 0 6px; text-align: center; }
.err { color: var(--err); font-size: 12px; margin-top: 6px; word-break: break-word; }

/* history */
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 0 8px 8px 0; }
td { padding: 9px 8px 9px 0; border-top: 1px solid var(--border); }
td.r, th.r { text-align: right; }

/* toast */
.windows-only[hidden], .power[hidden] { display: none; }
.toast { position: fixed; right: 20px; bottom: 20px; max-width: 380px; background: var(--panel); border: 1px solid var(--border);
  border-left: 4px solid var(--err); border-radius: 10px; padding: 11px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  transform: translateY(20px); opacity: 0; transition: .2s; pointer-events: none; font-size: 13px; z-index: 10; }
.toast.show { transform: none; opacity: 1; }
.toast.ok { border-left-color: var(--ok); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; place-items: center; z-index: 20; }
.modal.show { display: grid; }
.modal .card { width: min(360px, 90vw); }
.modal input { width: 100%; margin: 10px 0 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; }
.modal .row { justify-content: flex-end; }

@media (max-width: 760px) {
  .app { grid-template-columns: 64px 1fr; }
  .brand div, .nav-item span, .conn span:last-child { display: none; }
  .hero { grid-template-columns: auto 1fr; }
  .speed { grid-column: 1 / -1; text-align: left; }
  main { padding: 18px 16px 30px; }
}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#141a24"/><path d="M5 10c5 0 8 3 12 6" stroke="#4c8dff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M5 22c5 0 8-3 12-6" stroke="#ff9a3c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M16 16h6" stroke="#f2f5fa" stroke-width="3.4"/><path d="M21 10l7 6-7 6z" fill="#f2f5fa"/></svg>
      <div><b>dualnet</b><small id="ver"></small></div>
    </div>
    <button class="nav-item active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg><span data-i18n="navHome"></span></button>
    <button class="nav-item" data-page="downloads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span data-i18n="navDownloads"></span></button>
    <button class="nav-item" data-page="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10m6 10V4m6 16v-7m6 7H2"/></svg><span data-i18n="navHistory"></span></button>
    <button class="nav-item" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span data-i18n="navSettings"></span></button>
    <div class="nav-spacer"></div>
    <div class="conn"><span class="dot" id="conn"></span><span id="connText" data-i18n="connecting"></span></div>
  </nav>

  <main>
    <!-- ================= HOME ================= -->
    <section class="page active" id="page-home">
      <div class="info-banner" id="updBanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span id="updText"></span><button class="btn small" id="updBtn"></button></div>
      <div class="card onboard" id="onboard" hidden>
        <div class="chart-head">
          <h2 data-i18n="onbTitle"></h2>
          <div class="row">
            <button class="btn ghost small" id="onbRecheck" data-i18n="onbRecheck"></button>
            <button class="btn ghost small" id="onbDismiss" data-i18n="onbDismiss"></button>
          </div>
        </div>
        <div class="howto" data-i18n="onbSub"></div>
        <div id="onbList"></div>
      </div>
      <div class="warn-banner" id="linksWarn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><span data-i18n="oneLinkWarn"></span></div>

      <div class="card hero" id="hero">
        <button class="power" id="powerBtn" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1011.4 0"/></svg></button>
        <div>
          <div class="hero-title" id="heroTitle">—</div>
          <div class="hero-sub" id="heroSub"></div>
        </div>
        <div class="speed">
          <div><span class="num" id="totalNum">0</span><span class="unit">Mb/s</span></div>
          <div class="peak" id="peakTxt"></div>
        </div>
        <div class="sharebar" id="shareBar"></div>
      </div>

      <div class="grid links" id="links"></div>

      <div class="card mt">
        <div class="chart-head">
          <h2 data-i18n="appsTitle"></h2>
          <div class="legend" id="appsLegend"></div>
        </div>
        <div id="apps"></div>
      </div>

      <div class="card mt">
        <div class="chart-head">
          <h2 data-i18n="chartTitle"></h2>
          <div class="legend" id="legend"></div>
        </div>
        <div class="chart-box"><canvas id="chart"></canvas><div class="tip" id="tip"></div></div>
      </div>
    </section>

    <!-- ================= DOWNLOADS ================= -->
    <section class="page" id="page-downloads">
      <h1 data-i18n="navDownloads"></h1>
      <p class="lead" data-i18n="dlLead"></p>
      <div class="card">
        <form class="dl" id="dl">
          <input type="url" id="url" data-i18n-ph="urlPlaceholder" required>
          <select id="workers" data-i18n-title="connPerLink">
            <option value="2" data-i18n="conn2"></option>
            <option value="4" selected data-i18n="conn4"></option>
            <option value="8" data-i18n="conn8"></option>
          </select>
          <button class="btn" type="submit" data-i18n="download"></button>
        </form>
        <div class="jobs" id="jobs"><div class="empty" data-i18n="noDownloads"></div></div>
        <div class="howto mt" id="dir"></div>
      </div>
    </section>

    <!-- ================= HISTORY ================= -->
    <section class="page" id="page-history">
      <h1 data-i18n="navHistory"></h1>
      <p class="lead" data-i18n="historyLead"></p>
      <div class="row">

<script>
// ---------- language: the browser's if we have a translation (see lang/*.json), English otherwise (?lang=xx forces one) ----------
const I18N = /*I18N*/ {}; // filled in by the server from lang/*.json
const LANGS = Object.keys(I18N);
const LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(q)) return q;
  const l = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase().slice(0, 2);
  return LANGS.includes(l) ? l : 'en';
})();
document.documentElement.lang = LANG;
const t = (k, vars) => {
  let s = (I18N[LANG][k] ?? I18N.en[k] ?? k);
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace('{' + a + '}', b);
  return s;
};
const srv = msg => { // server messages are English; translate the known ones
  msg = String(msg || '').trim();
  const table = (I18N[LANG] || {})._server || {};
  for (const [en, local] of Object.entries(table)) if (msg.startsWith(en)) return local + msg.slice(en.length);
  return msg;
};
document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
document.querySelectorAll('[data-i18n-html]').forEach(e => e.innerHTML = t(e.dataset.i18nHtml));
document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
document.querySelectorAll('[data-i18n-title]').forEach(e => e.title = t(e.dataset.i18nTitle));

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const color = i => css('--l' + (i % 4));
const fmtMbps = v => v >= 100 ? v.toFixed(0) : v.toFixed(1);
function fmtBytes(n) {
  const u = t('units'); let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n.toFixed(0)) + ' ' + u[i];
}
function fmtDur(s) {
  if (!isFinite(s)) return '—';
  s = Math.round(s); const m = Math.floor(s / 60);
  return m ? `${m} min ${String(s % 60).padStart(2, '0')} s` : `${s} s`;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg, ok) {
  const el = $('toast'); el.textContent = msg; el.className = 'toast show' + (ok ? ' ok' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'toast', 4000);
}
async function post(url) {
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'X-Dualnet': '1' } });
    if (!r.ok) toast(srv(await r.text()));
    return r.ok;
  } catch (e) { toast(String(e)); return false; }
}
const linkIcon = name => /wi-?fi|wlan|wireless/i.test(name)
  ? '<path d="M2 8.5a15 15 0 0120 0M5 12a10 10 0 0114 0M8.5 15.5a5 5 0 017 0"/><circle cx="12" cy="19" r="1"/>'
  : /ethernet|usb|rndis|ncm|phone|mobile/i.test(name)
  ? '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'
  : '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>';

// ---------- navigation ----------
function show(page) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
  try { localStorage.setItem('page', page); } catch (e) {}
  if (page === 'history') loadHistory();
  if (page === 'home') requestAnimationFrame(resize);
}
document.querySelectorAll('.nav-item').forEach(b => b.addEventListener('click', () => show(b.dataset.page)));
try { const p = localStorage.getItem('page'); if (p && $('page-' + p)) show(p); } catch (e) {}

// ---------- state ----------
const WINDOW = 120, STEP = 0.5, MAXPTS = WINDOW / STEP;
const hist = [];
let links = [], peakTotal = 0, snapLast = null, busy = false;

// ---------- in-place update helpers ----------
let linksKey = '', jobsKey = '';
function setF(root, f, text) { // set the text of [data-f=f] only when it changed
  const e = root && root.querySelector('[data-f="' + f + '"]');
  text = String(text);
  if (e && e.textContent !== text) e.textContent = text;
}
function setH(e, html) { // set innerHTML only when it changed
  if (e && e._h !== html) { e._h = html; e.innerHTML = html; }
}

// ---------- home ----------
function renderHome(snap) {
  const p = snap.power || {};
  const manual = snap.os !== 'windows';
  const up = snap.links.filter(l => l.up && l.healthy && !l.overBudget);
  const total = snap.links.reduce((a, l) => a + l.rxMbps, 0);
  peakTotal = Math.max(peakTotal, total);
  $('hero').classList.toggle('off', manual ? !snap.proxy : !p.on);
  const pb = $('powerBtn');
  pb.hidden = manual;
  pb.classList.toggle('off', !p.on); pb.title = p.on ? t('powerOn') : t('powerOff'); pb.disabled = busy;
  // Off for Windows, yet programs set by hand to the proxy address still go through dualnet.
  const viaProxy = !p.on && snap.proxy ? snap.links.reduce((a, l) => a + l.active, 0) : 0;
  $('heroTitle').textContent = manual ? t('manualProxyTitle') : p.on ? t('heroOn') : viaProxy ? t('heroOffUsed') : t('heroOff');
  $('heroSub').textContent = manual ? (snap.proxy ? t('manualProxySub', { address: snap.proxy }) : t('proxyOff'))
    : p.on ? t(p.mode === 'proxy' ? 'heroOnProxy' : 'heroOnTransparent', { n: up.length })
    : viaProxy ? t('heroOffUsedSub', { n: viaProxy, address: snap.proxy }) : t('heroOffSub');
  $('totalNum').textContent = fmtMbps(total);
  $('peakTxt').textContent = t('peak', { s: fmtMbps(peakTotal) });
  // Everything below is updated in place. Rebuilding the DOM every 500 ms made the
  // share bar restart its animation and dropped hover states: it looked like flashing.
  const bar = $('shareBar');
  if (bar.children.length !== snap.links.length) bar.innerHTML = snap.links.map(() => '<span></span>').join('');
  snap.links.forEach((l, i) => {
    const sp = bar.children[i];
    sp.style.width = (100 * l.rxMbps / (total || 1)).toFixed(1) + '%';
    sp.style.background = color(i);
  });
  $('linksWarn').style.display = up.length < 2 ? 'flex' : 'none';

  const allRx = snap.links.reduce((a, l) => a + l.totalRx, 0) || 1;
  const box = $('links');
  const key = LANG + color(0) + snap.links.map(l => [l.name, l.ip, l.up, l.healthy, l.limit, l.budget, l.overBudget, l.standby].join(',')).join('|');
  if (key !== linksKey) { // links, their state or the theme changed: rebuild the cards
    linksKey = key;
    box.innerHTML = snap.links.map((l, i) => {
      const ok = l.up && l.healthy && !l.overBudget;
      const idle = ok && l.standby;
      const tag = !l.up ? t('tagDown') : !l.healthy ? t('tagNoAnswer') : l.overBudget ? t('tagOver') : idle ? t('tagStandby') : t('tagUp');
      const c = color(i);
      return `<div class="card link${ok ? '' : ' down'}">
        <div class="link-head">
          <div class="link-icon" style="background:color-mix(in srgb, ${c} 15%, transparent);color:${c}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${linkIcon(l.name)}</svg></div>
          <div><div class="link-name">${esc(l.name)}</div><div class="link-ip">${esc(l.ip)}</div></div>
          <span class="badge ${!ok ? 'bad' : idle ? 'idle' : 'ok'}">${tag}</span>
        </div>
        <div class="link-val"><span data-f="val"></span><small>Mb/s</small></div>
        <div class="stats">
          <span>${t('ping')} <b data-f="ping"></b></span>
          <span>${t('conns')} <b data-f="conns"></b></span>
          <span>${t('share')} <b data-f="share"></b></span>
        </div>
        <div class="stats" style="margin-top:4px"><span data-f="recv"></span><span data-f="month"></span></div>
        <div class="card-actions">
          <button class="btn ghost small" data-link="${esc(l.name)}" data-budget="${l.budget}" onclick="askBudget(this.dataset.link, +this.dataset.budget)">${l.budget ? t('budget') + ' ' + l.budget + ' GB' : t('noBudget')}</button>
          <button class="btn ghost small" data-link="${esc(l.name)}" data-limit="${l.limit}" onclick="askCap(this.dataset.link, +this.dataset.limit)">${l.limit ? t('cap') + ' ' + l.limit + ' Mb/s' : t('capNone')}</button>
        </div>
      </div>`;
    }).join('');
  }
  snap.links.forEach((l, i) => {
    const card = box.children[i];
    setF(card, 'val', fmtMbps(l.rxMbps));
    setF(card, 'ping', l.ping ? l.ping + ' ms' : '—');
    setF(card, 'conns', l.active);
    setF(card, 'share', (100 * l.totalRx / allRx).toFixed(0) + ' %');
    setF(card, 'recv', fmtBytes(l.totalRx) + ' ' + t('received'));
    setF(card, 'month', t('thisMonth') + ' ' + l.monthGB.toFixed(1) + (l.budget ? ' / ' + l.budget : '') + ' GB');
  });
}
$('powerBtn').addEventListener('click', async () => {
  if (!snapLast) return;
  busy = true; $('powerBtn').disabled = true;
  await post('/api/power?on=' + (snapLast.power && snapLast.power.on ? 0 : 1));
  busy = false;
});

// cap modal
let numCb = null; // what to do with the number typed in the dialog
function askNum(title, cur, cb) {
  numCb = cb; $('capTitle').textContent = title;
  $('capInput').value = cur || 0; $('capModal').classList.add('show'); $('capInput').focus(); $('capInput').select();
}
const askCap = (name, cur) => askNum(t('capPrompt', { n: name }), cur, v => post(`/api/limit?link=${encodeURIComponent(name)}&mbps=${v}`));
const askBudget = (name, cur) => askNum(t('budgetPrompt', { n: name }), cur, v => post(`/api/budget?link=${encodeURIComponent(name)}&gb=${v}`));
$('capCancel').onclick = () => $('capModal').classList.remove('show');
$('capOk').onclick = async () => {
  $('capModal').classList.remove('show');
  if (numCb) await numCb(encodeURIComponent($('capInput').value || 0));
};
$('capInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('capOk').click(); if (e.key === 'Escape') $('capCancel').click(); });

// ---------- chart (stacked areas) ----------
const cv = $('chart'), ctx = cv.getContext('2d'), tip = $('tip');
let hoverX = null;
function resize() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  if (!r.width) return;
  cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw();
}
new ResizeObserver(resize).observe(cv);
function niceMax(v) {
  if (v <= 10) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}
function draw() {
  const W = cv.clientWidth, H = cv.clientHeight, L = 40, R = 6, T = 8, B = 22, w = W - L - R, h = H - T - B;
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  const maxTotal = hist.reduce((m, p) => Math.max(m, p.v.reduce((a, b) => a + (b || 0), 0)), 0);
  const ymax = niceMax(maxTotal * 1.1);
  const x = k => L + w * (k + MAXPTS - hist.length) / (MAXPTS - 1);
  const y = v => T + h * (1 - v / ymax);
  ctx.font = '11px "Segoe UI", system-ui, sans-serif'; ctx.fillStyle = css('--muted'); ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = ymax * i / 4, yy = Math.round(y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(W - R, yy); ctx.stroke();
    ctx.fillText(v.toFixed(0), L - 6, yy);
  }
  ctx.textBaseline = 'top';
  for (let s = 0; s <= WINDOW; s += 30) {
    const xx = L + w * (1 - s / WINDOW);
    ctx.textAlign = s === 0 ? 'right' : s === WINDOW ? 'left' : 'center';
    ctx.fillText(s ? `-${s}s` : t('now'), xx, H - B + 6);
  }
  if (hist.length < 2) return;
  for (let li = links.length - 1; li >= 0; li--) {
    const path = () => hist.forEach((p, k) => {
      const top = p.v.slice(0, li + 1).reduce((a, b) => a + (b || 0), 0);
      k ? ctx.lineTo(x(k), y(top)) : ctx.moveTo(x(k), y(top));
    });
    const c = color(li);
    ctx.beginPath(); path(); ctx.lineTo(x(hist.length - 1), y(0)); ctx.lineTo(x(0), y(0)); ctx.closePath();
    const grad = ctx.createLinearGradient(0, T, 0, T + h);
    grad.addColorStop(0, c + '70'); grad.addColorStop(1, c + '18');
    ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); path(); ctx.strokeStyle = c; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.stroke();
  }
  if (hoverX !== null) {
    const k = Math.round((hoverX - L) / w * (MAXPTS - 1)) - (MAXPTS - hist.length);
    if (k >= 0 && k < hist.length) {
      const xx = x(k), p = hist[k];
      ctx.strokeStyle = css('--muted'); ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(xx, T); ctx.lineTo(xx, T + h); ctx.stroke(); ctx.setLineDash([]);
      const total = p.v.reduce((a, b) => a + (b || 0), 0);
      const ago = ((hist[hist.length - 1].t - p.t) / 1000).toFixed(0);
      tip.innerHTML = `<b>${fmtMbps(total)} Mb/s · ${t('agoS', { n: ago })}</b>` + links.map((l, i) =>
        `<div><span class="swatch" style="background:${color(i)}"></span>${esc(l.name)}: ${fmtMbps(p.v[i] || 0)} Mb/s</div>`).join('');
      tip.style.display = 'block';
      tip.style.left = Math.min(xx + 12, W - tip.offsetWidth - 4) + 'px'; tip.style.top = (T + 6) + 'px';
      return;
    }
  }
  tip.style.display = 'none';
}
cv.addEventListener('mousemove', e => { hoverX = e.offsetX; draw(); });
cv.addEventListener('mouseleave', () => { hoverX = null; draw(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
function renderLegend() {
  $('legend').innerHTML = links.map((l, i) => `<span><span class="swatch" style="background:${color(i)}"></span>${esc(l.name)}</span>`).join('');
}

// ---------- downloads ----------
function renderJobs(snap) {
  if (snap.dir) $('dir').textContent = t('destFolder', { d: snap.dir });
  if (!snap.jobs.length) return;
  const box = $('jobs');
  const jobs = snap.jobs.slice().reverse();
  const key = LANG + jobs.map(j => [j.id, j.state, j.file, j.err].join(',')).join('|');
  if (key !== jobsKey) { // a download started, ended or failed: rebuild the cards
    jobsKey = key;
    box.innerHTML = jobs.map(j => {
      const st = { running: t('stRunning'), done: t('stDone'), error: t('stError'), cancelled: t('stCancelled') }[j.state];
      return `<div class="job">
        <div class="top">
          <div class="name" title="${esc(j.url)}">${esc(j.file || j.url)}</div>
          <div class="actions">
            <span class="state ${j.state}">${st}</span>
            ${j.state === 'running' ? `<button class="btn ghost small" onclick="post('/api/cancel?id=${j.id}')">${t('cancel')}</button>` : ''}
            ${j.state === 'done' ? `<button class="btn ghost small" onclick="post('/api/reveal?id=${j.id}')">${t('openFolder')}</button>` : ''}
          </div>
        </div>
        <div class="bar" data-f="bar"></div>
        <div class="meta" data-f="meta"></div>
        ${j.err ? `<div class="err">${esc(srv(j.err))}</div>` : ''}
      </div>`;
    }).join('');
  }
  jobs.forEach((j, n) => {
    const el = box.children[n];
    if (!el) return;
    const pct = j.size ? 100 * j.done / j.size : 0;
    const avg = j.elapsed ? j.done * 8 / j.elapsed / 1e6 : 0;
    const eta = j.state === 'running' && j.mbps > 0 ? (j.size - j.done) * 8 / (j.mbps * 1e6) : NaN;
    const segs = (j.perLink || []).map((b, i) =>
      `<span style="width:${j.size ? (100 * b / j.size).toFixed(2) : 0}%;background:${color(i)}"></span>`).join('');
    const split = (j.perLink || []).map((b, i) =>
      `<span><span class="swatch" style="background:${color(i)}"></span> ${j.done ? (100 * b / j.done).toFixed(0) : 0} %</span>`).join(' ');
    setH(el.querySelector('[data-f="bar"]'), segs);
    setH(el.querySelector('[data-f="meta"]'), `
      <span>${pct.toFixed(1)} % · ${fmtBytes(j.done)} / ${fmtBytes(j.size)}</span>
      ${j.state === 'running' ? `<span>${fmtMbps(j.mbps)} Mb/s</span><span>${t('left', { t: fmtDur(eta) })}</span>` : `<span>${t('avgIn', { s: fmtMbps(avg), t: fmtDur(j.elapsed) })}</span>`}
      <span class="legend">${split}</span>`);
  });
}
$('dl').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/download', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Dualnet': '1' },
    body: JSON.stringify({ url: $('url').value.trim(), workers: +$('workers').value }) });
  if (r.ok) $('url').value = ''; else toast(srv(await r.text()));
});

// ---------- settings ----------
function setSwitch(id, on, disabled) { const s = $(id); if (document.activeElement !== s) s.checked = !!on; s.disabled = !!disabled; }
// ---------- installation check ----------
let doctorChecks = null, doctorBusy = false;
const FIX = {
  simultaneous: () => post('/api/system?do=simultaneous&on=1'),
  'clear-proxy': () => post('/api/sysproxy?on=0'),
  power: () => post('/api/power?on=1'),
  autostart: () => post('/api/autostart?on=1'),
};
const CHK_ICON = { ok: '✓', info: 'i', warn: '!', fail: '✕' };
function checkText(c) {
  const k = 'chk.' + c.msg, s = t(k, c.args || {});
  return s === k ? c.text : s; // no translation: the English sentence
}
function checkRows(list) {
  return list.map(c => `<div class="chk ${c.level}"><span class="ico">${CHK_ICON[c.level] || ''}</span><span class="txt">${esc(checkText(c))}</span>` +
    (c.fix && c.level !== 'ok' ? `<button class="btn small" data-fix="${esc(c.fix)}" onclick="doFix(this.dataset.fix)">${esc(t('fix.' + c.fix))}</button>` : '') + '</div>').join('');
}
async function loadDoctor() {
  if (doctorBusy) return;
  doctorBusy = true;
  try { doctorChecks = await (await fetch('/api/doctor')).json(); } catch (e) { /* server not ready */ }
  doctorBusy = false;
  renderDoctor();
}
function renderDoctor() {
  if (!doctorChecks) return;
  $('chkList').innerHTML = checkRows(doctorChecks);
  const todo = doctorChecks.filter(c => c.core && c.level !== 'ok');
  const show = !!snapLast && snapLast.os === 'windows' && !snapLast.onboarded && todo.length > 0;
  $('onboard').hidden = !show;
  if (show) $('onbList').innerHTML = checkRows(todo);
}
async function doFix(id) {
  if (FIX[id]) await FIX[id]();
  await new Promise(r => setTimeout(r, 900)); // let Windows apply it
  loadDoctor();
}
$('chkRun').addEventListener('click', async () => {
  const b = $('chkRun'); b.disabled = true; b.textContent = t('chkRunning');
  await loadDoctor();
  b.disabled = false; b.textContent = t('chkRun');
});
$('onbRecheck').addEventListener('click', loadDoctor);
$('onbDismiss').addEventListener('click', async () => { await post('/api/onboarding?done=1'); $('onboard').hidden = true; });
loadDoctor();
setInterval(() => {
  const settingsOpen = $('page-settings').classList.contains('active');
  if (settingsOpen || (snapLast && !snapLast.onboarded)) loadDoctor();
}, 60000);

// ---------- diagnostics ----------
async function copyDiag() {
  const text = await (await fetch('/api/diagnostics')).text();
  try { await navigator.clipboard.writeText(text); }
  catch (e) { // clipboard API refused: fall back to a temporary textarea
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(t('copied'), true);
}
async function loadLog() {
  const el = $('logView');
  const txt = (await (await fetch('/api/log')).text()).trim();
  el.textContent = txt || t('noLog');
  el.scrollTop = el.scrollHeight;
}
$('diagCopy').addEventListener('click', copyDiag);
$('logFolder').addEventListener('click', () => post('/api/logfolder'));
$('logToggle').addEventListener('click', async () => {
  const el = $('logView');
  el.hidden = !el.hidden;
  $('logToggle').textContent = t(el.hidden ? 'logView' : 'logHide');
  if (!el.hidden) await loadLog();
});
setInterval(() => { if (!$('logView').hidden && $('page-settings').classList.contains('active')) loadLog(); }, 5000);

// ---------- links: speed test ----------
let linksCfgKey = '';
function renderLinksCfg(snap) {
  const box = $('linksCfg');
  const key = LANG + snap.links.map(l => l.name + l.ip).join('|');
  if (key !== linksCfgKey) { // the set of links changed: rebuild the rows
    linksCfgKey = key;
    box.innerHTML = snap.links.map(l => `<div class="setting">
      <div class="txt"><div class="title">${esc(l.name)} <span class="link-ip">${esc(l.ip)}</span></div><div class="sub" data-f="last"></div></div>
      <select class="role" data-link="${esc(l.name)}" onchange="setRole(this)">
        <option value="normal">${esc(t('roleNormal'))}</option><option value="overflow">${esc(t('roleOverflow'))}</option>
      </select>
      <button class="btn ghost small" data-link="${esc(l.name)}" onclick="runSpeed(this)">${esc(t('speedTest'))}</button>
    </div>`).join('');
  }
  snap.links.forEach((l, i) => {
    const row = box.children[i];
    if (!row) return;
    const when = l.speedAt ? new Date(l.speedAt).toLocaleString(LANG, { dateStyle: 'short', timeStyle: 'short' }) : '';
    setF(row, 'last', l.speedAt ? t('speedLast', { s: Math.round(l.speedMbps), d: when }) : t('speedNever'));
    const sel = row.querySelector('select.role');
    if (sel && document.activeElement !== sel) sel.value = l.overflow ? 'overflow' : 'normal';
  });
}
function setRole(sel) { post('/api/role?link=' + encodeURIComponent(sel.dataset.link) + '&mode=' + sel.value); }
async function runSpeed(btn) {
  const name = btn.dataset.link;
  btn.disabled = true; btn.textContent = t('speedTesting');
  try {
    const r = await fetch('/api/speedtest?link=' + encodeURIComponent(name), { method: 'POST', headers: { 'X-Dualnet': '1' } });
    if (r.ok) toast(t('speedDone', { n: name, s: Math.round((await r.json()).mbps) }), true);
    else toast(srv(await r.text()));
  } catch (e) { toast(String(e)); }
  btn.disabled = false; btn.textContent = t('speedTest');
}

// ---------- applications and rules ----------
let appsKey = '', rulesKey = '';
const LIMITS = [0, 2, 5, 10, 20, 50, 100, 200];
function limitOptions(cur) {
  const vals = LIMITS.includes(cur) ? LIMITS : [...LIMITS, cur].sort((a, b) => a - b);
  return vals.map(v => `<option value="${v}"${v === cur ? ' selected' : ''}>${v ? esc(t('limitMbps', { n: v })) : esc(t('limitNone'))}</option>`).join('');
}
const PING = '*ping'; // rule value: the link with the lowest ping
function routeName(link) { return link === PING ? t('routePing') : t('routeOnly', { n: link }); }
function routeOptions(snap, current) {
  return `<option value="">${esc(t('routeAll'))}</option><option value="${PING}"${current === PING ? ' selected' : ''}>${esc(t('routePing'))}</option>` + snap.links.map(l =>
    `<option value="${esc(l.name)}"${current === l.name ? ' selected' : ''}>${esc(t('routeOnly', { n: l.name }))}</option>`).join('');
}
function renderApps(snap) {
  const box = $('apps'), apps = snap.apps || [];
  $('appsLegend').innerHTML = snap.links.map((l, i) => `<span><span class="swatch" style="background:${color(i)}"></span>${esc(l.name)}</span>`).join('');
  if (!snap.tun || !snap.tun.on) { setH(box, `<div class="empty">${esc(t('appsNeedTun'))}</div>`); appsKey = ''; return; }
  if (!apps.length) { setH(box, `<div class="empty">${esc(t('appsNone'))}</div>`); appsKey = ''; return; }
  // rebuild only when the list, the rules or the links change; otherwise update the numbers in place
  const key = LANG + snap.links.map(l => l.name).join(',') + '|' + apps.map(a => a.name + ':' + a.rule + ':' + a.limit).join(',');
  if (key !== appsKey) {
    appsKey = key; box._h = null;
    box.innerHTML = `<div class="app-row head"><span>${t('colApp')}</span><span class="r">${t('colConns')}</span><span class="r">${t('colSpeed')}</span><span class="r">${t('colData')}</span><span class="hide-sm">${t('colLinks')}</span><span class="hide-sm">${t('colRoute')}</span><span class="hide-sm">${t('colLimit')}</span></div>` +
      apps.map((a, i) => `<div class="app-row">
        <span class="app-name" title="${esc(a.name)}">${esc(a.name)}</span>
        <span class="r" data-f="conns"></span><span class="r" data-f="speed"></span><span class="r" data-f="data"></span>
        <div class="bar hide-sm" data-f="bar" style="margin:0"></div>
        <select class="hide-sm" data-app="${esc(a.name)}" onchange="post('/api/rule?app=' + encodeURIComponent(this.dataset.app) + '&link=' + encodeURIComponent(this.value))">${routeOptions(snap, a.rule)}</select>
        <select class="hide-sm" data-app="${esc(a.name)}" onchange="post('/api/applimit?app=' + encodeURIComponent(this.dataset.app) + '&mbps=' + this.value)">${limitOptions(a.limit)}</select>
      </div>`).join('');
  }
  apps.forEach((a, i) => {
    const row = box.children[i + 1];
    if (!row) return;
    setF(row, 'conns', a.active);
    setF(row, 'speed', a.rxMbps >= 0.05 ? fmtMbps(a.rxMbps) + ' Mb/s' : '—');
    setF(row, 'data', fmtBytes(a.rx));
    const tot = a.perLink.reduce((x, y) => x + y, 0) || 1;
    setH(row.querySelector('[data-f="bar"]'), a.perLink.map((b, k) => `<span style="width:${(100 * b / tot).toFixed(1)}%;background:${color(k)}"></span>`).join(''));
  });
}
function renderRules(snap) {
  const rules = snap.rules || [];
  const key = LANG + snap.links.map(l => l.name).join(',') + '|' + rules.map(r => r.app + ':' + r.link + ':' + r.limit).join(',');
  if (key === rulesKey) return;
  rulesKey = key;
  $('rules').innerHTML = rules.length ? rules.map(r => `<div class="rule-row"><b>${esc(r.app)}</b><span>${esc([r.link ? routeName(r.link) : '', r.limit ? t('limitMax', { n: r.limit }) : ''].filter(Boolean).join(' · '))}</span>
      <button class="btn ghost small" data-app="${esc(r.app)}" onclick="post('/api/rule?app=' + encodeURIComponent(this.dataset.app) + '&link=&all=1')">${t('ruleRemove')}</button></div>`).join('')
    : `<div class="empty">${t('rulesNone')}</div>`;
  const sel = $('ruleLink'), cur = sel.value;
  sel.innerHTML = snap.links.map(l => `<option value="${esc(l.name)}">${esc(t('routeOnly', { n: l.name }))}</option>`).join('') + `<option value="${PING}">${esc(t('routePing'))}</option>`;
  if (cur) sel.value = cur;
  $('appNames').innerHTML = (snap.apps || []).map(a => `<option value="${esc(a.name)}">`).join('');
}
$('ruleForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (await post('/api/rule?app=' + encodeURIComponent($('ruleApp').value.trim()) + '&link=' + encodeURIComponent($('ruleLink').value))) $('ruleApp').value = '';
});

function renderUpdate(snap) {
  const u = snap.update || {};
  $('updBanner').style.display = u.available ? 'flex' : 'none';
  if (u.available) $('updText').textContent = t('updAvail', { v: u.latest });
  $('updBtn').textContent = t(u.install ? 'updInstall' : 'updGet');
  setSwitch('updSw', u.check, false);
  setSwitch('notifSw', snap.notify, false);
}
$('notifSw').addEventListener('change', e => post('/api/notify?on=' + (e.target.checked ? 1 : 0)));
$('notifTest').addEventListener('click', async () => { if (await post('/api/notify/test')) toast(t('notifSent'), true); });
$('updBtn').addEventListener('click', async e => {
  if (!(snapLast.update && snapLast.update.install)) return post('/api/update/open');
  e.target.disabled = true; toast(t('updInstalling'), true);
  if (!await post('/api/update/install')) e.target.disabled = false; // on success dualnet restarts
});
$('updSw').addEventListener('change', e => post('/api/updatecheck?on=' + (e.target.checked ? 1 : 0)));

function renderSettings(snap) {
  const tun = snap.tun || {}, sys = snap.sys || {}, sy = snap.system || {};
  document.querySelectorAll('.windows-only').forEach(el => { el.hidden = snap.os !== 'windows'; });
  setSwitch('tunSw', tun.on, !tun.on && !tun.admin);
  $('tunText').textContent = tun.on ? t('tunOn') : tun.err ? srv(tun.err) : !tun.admin ? t('tunNeedAdmin') : t('tunOff');
  $('tunText').classList.toggle('warn', !tun.on && (!!tun.err || !tun.admin));
  setSwitch('sysSw', sys.ours, !snap.proxy);
  $('sysText').textContent = sys.err ? srv(sys.err) : sys.ours ? t('sysOurs') : sys.on ? t('sysOther', { s: sys.server }) : t('sysOff');
  $('sysText').classList.toggle('warn', !sys.ours && sys.on);
  $('proxyAddr').textContent = snap.proxy || t('proxyOff');
  if (document.activeElement !== $('budgetWarn') && snap.budgetWarn) $('budgetWarn').value = snap.budgetWarn;
  const domainSel = $('domainLink'), domainKey = snap.links.map(l => l.name).join('\u0000');
  if (domainSel.dataset.key !== domainKey) {
    const current = domainSel.value;
    domainSel.replaceChildren(...snap.links.map(l => new Option(l.name, l.name)));
    domainSel.value = snap.links.some(l => l.name === current) ? current : (snap.links[0]?.name || '');
    domainSel.dataset.key = domainKey;
  }
  setSwitch('simSw', sy.simultaneous, !sy.admin);
  $('simText').textContent = !sy.admin && !sy.simultaneous ? t('needAdmin') : sy.simultaneous ? t('simOn') : t('simOff');
  const m = sy.metrics || {};
  const best = Math.min(...snap.links.map(l => m[l.name] ?? 1e9));
  const pref = snap.links.map(l => `<button class="btn ghost small${m[l.name] === best ? ' chosen' : ''}" ${sy.admin ? '' : 'disabled'} onclick="post('/api/system?do=prefer&link=${encodeURIComponent(l.name)}')">${esc(l.name)}</button>`).join('') +
    `<button class="btn ghost small" ${sy.admin ? '' : 'disabled'} onclick="post('/api/system?do=prefer&link=')">${t('automatic')}</button>`;
  if ($('prefer').innerHTML !== pref) $('prefer').innerHTML = pref;
  setSwitch('autoSw', snap.autostart, false);
}
$('tunSw').addEventListener('change', e => post('/api/transparent?on=' + (e.target.checked ? 1 : 0)));
$('sysSw').addEventListener('change', e => post('/api/sysproxy?on=' + (e.target.checked ? 1 : 0)));
$('simSw').addEventListener('change', e => post('/api/system?do=simultaneous&on=' + (e.target.checked ? 1 : 0)));
$('autoSw').addEventListener('change', e => post('/api/autostart?on=' + (e.target.checked ? 1 : 0)));

$('budgetWarnForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (await post('/api/budgetwarn?percent=' + encodeURIComponent($('budgetWarn').value))) toast(t('saved'), true);
});

async function loadNamedSettings() {
  try {
    const [domains, profiles] = await Promise.all(['/api/domainrules', '/api/profiles'].map(async url => {
      const r = await fetch(url);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }));
    const domainBox = $('domainRules');
    domainBox.replaceChildren();
    for (const rule of domains) {
      const row = document.createElement('div'); row.className = 'rule-row';
      const name = document.createElement('b'); name.textContent = rule.domain;
      const link = document.createElement('span'); link.textContent = rule.link;
      const remove = document.createElement('button'); remove.className = 'btn ghost small'; remove.textContent = t('ruleRemove');
      remove.addEventListener('click', async () => {
        if (await post('/api/domainrule?domain=' + encodeURIComponent(rule.domain) + '&link=')) await loadNamedSettings();
      });
      row.append(name, link, remove); domainBox.append(row);
    }
    const profileBox = $('profiles');
    profileBox.replaceChildren();
    for (const name of profiles) {
      const row = document.createElement('div'); row.className = 'rule-row';
      const label = document.createElement('b'); label.textContent = name;
      const apply = document.createElement('button'); apply.className = 'btn ghost small'; apply.textContent = t('profileApply');
      apply.addEventListener('click', async () => {
        if (await post('/api/profile?action=apply&name=' + encodeURIComponent(name))) {
          toast(t('profileApplied'), true); await loadNamedSettings();
        }
      });
      const remove = document.createElement('button'); remove.className = 'btn ghost small'; remove.textContent = t('ruleRemove');
      remove.addEventListener('click', async () => {
        if (confirm(t('profileDeleteConfirm', { name }))) {
          if (await post('/api/profile?action=delete&name=' + encodeURIComponent(name))) await loadNamedSettings();
        }
      });
      row.append(label, apply, remove); profileBox.append(row);
    }
  } catch (e) { toast(String(e)); }
}
$('domainForm').addEventListener('submit', async e => {
  e.preventDefault();
  const domain = $('domainName').value.trim(), link = $('domainLink').value;
  if (link && await post('/api/domainrule?domain=' + encodeURIComponent(domain) + '&link=' + encodeURIComponent(link))) {
    $('domainName').value = ''; await loadNamedSettings();
  }
});
$('profileForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('profileName').value.trim();
  if (!name) return;
  try {
    const r = await fetch('/api/profiles');
    if (!r.ok) { toast(srv(await r.text())); return; }
    if ((await r.json()).includes(name) && !confirm(t('profileReplaceConfirm', { name }))) return;
    if (await post('/api/profile?action=save&name=' + encodeURIComponent(name))) {
      $('profileName').value = ''; await loadNamedSettings();
    }
  } catch (e) { toast(String(e)); }
});
document.querySelector('[data-page="settings"]').addEventListener('click', loadNamedSettings);
loadNamedSettings();

// ---------- history ----------
async function loadHistory() {
  try {
    const days = await (await fetch('/api/history')).json();
    const el = $('history');
    if (!days.length) { el.textContent = t('noHistory'); return; }
    const names = [...new Set(days.flatMap(d => Object.keys(d.links)))];
    const idx = n => { const i = links.findIndex(l => l.name === n); return i < 0 ? names.indexOf(n) : i; };
    el.className = '';
    el.innerHTML = `<table><tr><th>${t('day')}</th>${names.map(n =>
      `<th class="r"><span class="swatch" style="background:${color(idx(n))}"></span> ${esc(n)}</th>`).join('')}<th class="r">${t('total')}</th><th style="width:28%">${t('split')}</th></tr>` +
      days.map(d => {
        const tot = names.reduce((a, n) => a + ((d.links[n] || {}).rx || 0), 0);
        const bar = names.map(n => `<span style="width:${(100 * ((d.links[n] || {}).rx || 0) / (tot || 1)).toFixed(1)}%;background:${color(idx(n))}"></span>`).join('');
        const date = new Date(d.date + 'T12:00:00').toLocaleDateString(LANG, { weekday: 'short', day: 'numeric', month: 'short' });
        return `<tr><td>${date}</td>${names.map(n => `<td class="r">${fmtBytes((d.links[n] || {}).rx || 0)}</td>`).join('')}<td class="r"><b>${fmtBytes(tot)}</b></td><td><div class="bar" style="margin:0">${bar}</div></td></tr>`;
      }).join('') + '</table>';
  } catch (e) { /* server not ready */ }
}
setInterval(() => { if ($('page-history').classList.contains('active')) loadHistory(); }, 30000);

// ---------- live stream ----------
function connect() {
  const es = new EventSource('/api/events');
  es.onopen = () => { $('conn').classList.add('on'); $('connText').textContent = t('live'); };
  es.onerror = () => { $('conn').classList.remove('on'); $('connText').textContent = t('disconnected'); };
  es.onmessage = ev => {
    const snap = JSON.parse(ev.data);
    snap.links = snap.links || []; snap.jobs = snap.jobs || [];
    snapLast = snap;
    if (snap.links.length !== links.length) { links = snap.links; renderLegend(); }
    links = snap.links;
    hist.push({ t: snap.t, v: snap.links.map(l => l.rxMbps) });
    if (hist.length > MAXPTS) hist.shift();
    $('ver').textContent = snap.version || '';
    renderHome(snap); renderApps(snap); renderJobs(snap); renderSettings(snap); renderLinksCfg(snap); renderRules(snap); renderUpdate(snap);
    if ($('page-home').classList.contains('active')) draw();
  };
}
connect();
